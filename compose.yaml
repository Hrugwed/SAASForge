services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: saasforge
      POSTGRES_USER: saasforge
      POSTGRES_PASSWORD: saasforge
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saasforge -d saasforge"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - saasforge_postgres_data:/var/lib/postgresql/data

volumes:
  saasforge_postgres_data:
